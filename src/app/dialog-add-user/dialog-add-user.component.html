<h2 mat-dialog-title>Add User</h2>
<mat-dialog-content>
  <mat-form-field class="mr-16">
    <mat-label>First name</mat-label>
    <input matInput #input maxlength="4" placeholder="First name" (input)="onInput()" />
    <!-- <mat-hint >Please enter a name</mat-hint> -->
 </mat-form-field>
 <mat-form-field>
    <mat-label>Last name</mat-label>
    <input matInput #input maxlength="4" placeholder="Last name" (input)="onInput()" />
</mat-form-field>

<div>
  <mat-form-field class="full-width">
    <mat-label>Birth Date</mat-label>
    <input matInput [matDatepicker]="datepicker">
    <mat-datepicker #datepicker/>
    <mat-datepicker-toggle [for]="datepicker" matSuffix/>
  </mat-form-field>
</div>

 <div>
  <mat-form-field class="full-width">
    <mat-label>Street & House No.</mat-label>
    <input matInput #input maxlength="4" placeholder="Street & House No." (input)="onInput()" />
</mat-form-field>
 </div>

 <div>
  <mat-form-field class="mr-16">
    <mat-label>Zip code</mat-label>
    <input matInput #input maxlength="4" placeholder="Zip code" (input)="onInput()" />
</mat-form-field>
<mat-form-field>
  <mat-label>City</mat-label>
  <input matInput #input maxlength="4" placeholder="CITY" (input)="onInput()" />
</mat-form-field>
 </div>

<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button [mat-dialog-close]="animal()" cdkFocusInitial>Save</button>
</mat-dialog-actions>
